<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1a2e"/>
      <stop offset="0.5" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="180" y1="280" x2="440" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4dc9f6"/>
      <stop offset="0.45" stop-color="#2196ff"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="540" y1="280" x2="800" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8eef5"/>
      <stop offset="0.35" stop-color="#b0c4de"/>
      <stop offset="0.7" stop-color="#8aa8c7"/>
      <stop offset="1" stop-color="#c8d8e8"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="120" y1="360" x2="904" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1565c0" stop-opacity="0.4"/>
      <stop offset="0.35" stop-color="#2196ff" stop-opacity="0.8"/>
      <stop offset="0.65" stop-color="#4dc9f6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00bfff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="80" y1="480" x2="944" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2196ff" stop-opacity="0.05"/>
      <stop offset="0.25" stop-color="#2196ff" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#00bfff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00bfff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="480" cy="480" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2196ff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#1565c0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="512" cy="830" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2196ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
    <filter id="outerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#2196ff" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- Ambient glows -->
  <ellipse cx="480" cy="480" rx="360" ry="300" fill="url(#centerGlow)"/>
  <ellipse cx="512" cy="830" rx="300" ry="120" fill="url(#floorGlow)"/>

  <!-- Circuit traces -->
  <g opacity="0.45">
    <path d="M70 430 H230 L260 400" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M50 470 H210 L240 450" stroke="url(#circuitGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M90 510 H250" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M110 550 H220 L250 530" stroke="url(#circuitGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M764 400 L794 430 H954" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M784 450 L814 470 H974" stroke="url(#circuitGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M774 510 H934" stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M774 530 L804 550 H914" stroke="url(#circuitGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Circuit dots with glow -->
  <g filter="url(#dotGlow)">
    <circle cx="70" cy="430" r="3.5" fill="#4dc9f6"/>
    <circle cx="954" cy="430" r="3.5" fill="#4dc9f6"/>
    <circle cx="50" cy="470" r="2.5" fill="#00bfff"/>
    <circle cx="974" cy="470" r="2.5" fill="#00bfff"/>
    <circle cx="90" cy="510" r="2" fill="#2196ff"/>
    <circle cx="934" cy="510" r="2" fill="#2196ff"/>
  </g>
  <circle cx="70" cy="430" r="2.5" fill="#4dc9f6"/>
  <circle cx="954" cy="430" r="2.5" fill="#4dc9f6"/>
  <circle cx="50" cy="470" r="2" fill="#00bfff"/>
  <circle cx="974" cy="470" r="2" fill="#00bfff"/>
  <circle cx="90" cy="510" r="1.5" fill="#2196ff"/>
  <circle cx="934" cy="510" r="1.5" fill="#2196ff"/>

  <!-- Wing swoosh -->
  <path d="M130 390 Q320 320 500 340 Q680 320 870 390 Q740 355 500 365 Q260 355 130 390Z" fill="url(#wingGrad)" opacity="0.4"/>
  <path d="M170 400 Q330 350 500 360 Q670 350 830 400" stroke="url(#wingGrad)" stroke-width="1.8" fill="none" opacity="0.6"/>

  <!-- V letter: bold, clean -->
  <g filter="url(#outerGlow)">
    <path d="M200 290 L395 740 L590 290 L500 290 L395 590 L290 290 Z" fill="url(#vGrad)"/>
  </g>

  <!-- S letter: bold, clean -->
  <g filter="url(#outerGlow)">
    <path d="
      M780 340 L780 310
      Q775 280 745 265 Q710 250 670 255 Q625 262 610 290
      Q595 320 615 350 Q630 375 670 395
      L730 425
      Q768 445 775 480 Q782 520 760 548
      Q735 578 690 582 Q645 584 620 562 Q605 548 598 530
      L598 530 L530 555
      Q545 600 580 628 Q620 655 670 660
      Q730 660 775 632 Q820 600 828 548
      Q835 495 805 460 Q780 432 740 415
      L680 388
      Q648 374 638 350 Q630 328 640 308
      Q655 282 685 280 Q715 278 730 295 Q738 306 740 320
      Z
    " fill="url(#sGrad)"/>
  </g>

  <!-- Accent dots -->
  <circle cx="820" cy="268" r="5.5" fill="#4dc9f6" opacity="0.85"/>
  <circle cx="848" cy="298" r="2.8" fill="#00bfff" opacity="0.65"/>
  <circle cx="178" cy="740" r="3.5" fill="#2196ff" opacity="0.55"/>
</svg>
